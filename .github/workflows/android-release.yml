name: Build signed Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: VITE_NATIVE_PACKAGE=1 npm run build
      - run: npx cap sync android
      - name: Restore release key
        env:
          KEYSTORE_B64: ${{ secrets.SF_TAPREAD_ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tapread-release.p12"
      - name: Build signed release APK
        env:
          TAPREAD_RELEASE_KEYSTORE: ${{ runner.temp }}/tapread-release.p12
          TAPREAD_RELEASE_STORE_PASSWORD: ${{ secrets.SF_TAPREAD_ANDROID_STORE_PASSWORD }}
          TAPREAD_RELEASE_KEY_ALIAS: tapread-release
          TAPREAD_RELEASE_KEY_PASSWORD: ${{ secrets.SF_TAPREAD_ANDROID_KEY_PASSWORD }}
        run: android/gradlew -p android :app:assembleRelease
      - name: Verify release signature and manifest
        run: |
          apksigner verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          apkanalyzer manifest print android/app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/manifest.xml"
          ! grep -q 'android:debuggable="true"' "$RUNNER_TEMP/manifest.xml"
          ! grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/manifest.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: tapread-canvas-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
